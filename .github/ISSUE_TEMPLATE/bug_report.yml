name: Bug report
description: Report a problem or unexpected behavior
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue!
        Please fill in the fields below with as much detail as possible.

  - type: checkboxes
    id: preliminary-checks
    attributes:
      label: Preliminary checks
      options:
        - label: I have searched the existing issues and did not find a duplicate
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Clearly describe what is not working.
      placeholder: When I do X, Y happens...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to trigger the problem.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of the software you are using.
      placeholder: e.g. 1.2.3
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Paste any relevant logs here. They will be automatically formatted as code.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If helpful, drag and drop images here to illustrate the problem.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other information that might help.