name: Feature request
description: Suggest a new feature or an improvement
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe your idea as clearly as possible.

  - type: checkboxes
    id: preliminary-checks
    attributes:
      label: Preliminary checks
      options:
        - label: I have searched the existing issues and none propose the same feature
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Explain the need or difficulty this feature would address.
      placeholder: I often struggle when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you imagine it should work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you have evaluated or already use.

  - type: dropdown
    id: priority
    attributes:
      label: Importance to you
      options:
        - Low (nice to have)
        - Medium (would improve my workflow)
        - High (I need it to use the project)
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on this feature with a pull request

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, links, or any other helpful material.